name: Android CI / CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB for Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure SDK and Environment
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" > gradle.properties
          echo "org.gradle.configuration-cache=false" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "ksp.useKSP2=true" >> gradle.properties
          mkdir -p gradle/wrapper
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          else
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          fi
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Patch KSP version for Gradle 9.3.1
        run: |
          echo "=== Current KSP references ==="
          grep -r "ksp" --include="*.toml" --include="*.kts" --include="*.gradle" -n || echo "No ksp found in grep"
          if [ -f gradle/libs.versions.toml ]; then
            echo "--- Before patch libs.versions.toml ---"
            grep -i ksp gradle/libs.versions.toml || true
            sed -i 's/ksp = ".*"/ksp = "2.1.20-1.0.32"/g' gradle/libs.versions.toml || true
            sed -i 's/kspVersion = ".*"/kspVersion = "2.1.20-1.0.32"/g' gradle/libs.versions.toml || true
            echo "--- After patch ---"
            grep -i ksp gradle/libs.versions.toml || true
          fi
          if [ -f build.gradle.kts ]; then
            sed -i 's/com.google.devtools.ksp.*version.*".*"/com.google.devtools.ksp" version "2.1.20-1.0.32"/g' build.gradle.kts || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Decode Upload Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          ls -lh app/upload-keystore.jks
          echo "Keystore decoded - NOT modified"

      - name: Build Release Bundle with new keystore
        env:
          STORE_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew bundleRelease --stacktrace --no-daemon --no-configuration-cache -Djava.awt.headless=true \
              -Pandroid.injected.signing.store.file=app/upload-keystore.jks \
              -Pandroid.injected.signing.store.password=$STORE_PASS \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASS
          else
            gradle bundleRelease --stacktrace --no-daemon --no-configuration-cache -Djava.awt.headless=true \
              -Pandroid.injected.signing.store.file=app/upload-keystore.jks \
              -Pandroid.injected.signing.store.password=$STORE_PASS \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASS
          fi

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasl-market-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
