name: Android CI / CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB for Play Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare Keystore and Environment
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f wasl-market.jks ]; then
            keytool -genkeypair -alias wasl -keyalg RSA -keysize 2048 -validity 10000 -keystore wasl-market.jks -storepass wasl123 -keypass wasl123 -dname "CN=Wasl Market, OU=Wasl, O=Wasl, L=Riyadh, ST=Riyadh, C=SA" -deststoretype PKCS12
          fi
          touch .env
          touch .env.example

      - name: Make Gradlew Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Release Bundle
        run: |
          if [ -f gradlew ]; then
            ./gradlew bundleRelease --stacktrace
          else
            gradle bundleRelease --stacktrace
          fi

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasl-market-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
