name: recover-keystore
on: workflow_dispatch
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Recover jks file
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > recovered.jks
          keytool -list -v -keystore recovered.jks -storepass "${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}" | grep SHA1
      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: recovered-keystore
          path: recovered.jks